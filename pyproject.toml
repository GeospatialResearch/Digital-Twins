[build-system]
requires = [
    "setuptools>=61.0.0",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/eddie/_version.py"

[project]
name = "eddie"
dynamic = ["version"]
description = "A framework for building modular spatial digital twins."
readme = "README.md"
authors = [{ name = "Luke Parkinson", email = "luke.parkinson@canterbury.ac.nz" }]
license = { file = "LICENSE" }
keywords = ["EDDIE", "Digital Twin", "Geospatial", "Spatial", "Framework"]
dependencies = [
    "aiohttp",
    "celery",
    "flask",
    "flask-cors",
    "flask_swagger_ui",
    "geoalchemy2",
    "geoapis",
    "geopandas",
    "gevent",
    "gunicorn",
    "pandas",
    "python-dotenv",
    "pywps",
    "rasterio",
    "requests",
    "shapely",
    "sqlalchemy",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pip-tools", "pytest"]

[project.urls]
Homepage = "https://github.com/GeospatialResearch/Digital-Twins"

[tool.setuptools.package-data]
"eddie" = ["**/*.xml", "static/*.yml"]
